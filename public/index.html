<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vCluster Control Tower | Kubernetes Demo</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Background Animation -->
    <div class="background-animation">
        <div class="cube"></div>
        <div class="cube"></div>
        <div class="cube"></div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                    <path d="M2 17l10 5 10-5"/>
                    <path d="M2 12l10 5 10-5"/>
                </svg>
                <h1>vCluster Control Tower</h1>
            </div>
            <div class="status-badge" id="connectionStatus">
                <span class="status-dot"></span>
                <span class="status-text">Connecting...</span>
            </div>
        </header>

        <!-- Cluster Overview Section -->
        <section class="section">
            <div class="section-header">
                <h2>
                    <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M12 6v6l4 2"/>
                    </svg>
                    Host Cluster Overview
                </h2>
                <button class="refresh-btn" id="refreshCluster" aria-label="Refresh cluster data">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M23 4v6h-6M1 20v-6h6"/>
                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                    </svg>
                </button>
            </div>
            <div class="cluster-grid" id="clusterGrid">
                <!-- Cluster stats will be injected here -->
            </div>
        </section>

        <!-- vClusters Section -->
        <section class="section">
            <div class="section-header">
                <h2>
                    <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="2" y="3" width="20" height="14" rx="2"/>
                        <path d="M8 21h8"/>
                        <path d="M12 17v4"/>
                    </svg>
                    Virtual Clusters
                </h2>
                <button class="refresh-btn" id="refreshVclusters" aria-label="Refresh vcluster data">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M23 4v6h-6M1 20v-6h6"/>
                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                    </svg>
                </button>
            </div>
            <div class="vcluster-grid" id="vclusterGrid">
                <!-- vClusters will be injected here -->
            </div>
        </section>

        <!-- Self Awareness Section -->
        <section class="section">
            <div class="section-header">
                <h2>
                    <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    Pod Self-Awareness
                </h2>
                <button class="refresh-btn" id="refreshSelf" aria-label="Refresh pod data">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M23 4v6h-6M1 20v-6h6"/>
                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                    </svg>
                </button>
            </div>
            <div class="self-grid" id="selfGrid">
                <!-- Pod info will be injected here -->
            </div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <p>vCluster Control Tower v2.0 | Last updated: <span id="lastUpdate">Never</span></p>
            <p class="demo-notice" id="demoNotice" style="display: none;">
                🔧 Running in <strong>Demo Mode</strong> - Deploy to Kubernetes for live data
            </p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
