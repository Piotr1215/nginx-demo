apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pod-party
  annotations:
    # Uncomment for specific ingress controllers
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  rules:
  - host: pod-party.example.com  # Change this to your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pod-party
            port:
              number: 80
  # Uncomment for TLS
  # tls:
  # - hosts:
  #   - pod-party.example.com
  #   secretName: pod-party-tls
