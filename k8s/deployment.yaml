apiVersion: v1
kind: Namespace
metadata:
  name: pod-inspector
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-inspector
  namespace: pod-inspector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-inspector
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pod-inspector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pod-inspector
subjects:
  - kind: ServiceAccount
    name: pod-inspector
    namespace: pod-inspector
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-inspector
  namespace: pod-inspector
  labels:
    app: pod-inspector
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pod-inspector
  template:
    metadata:
      labels:
        app: pod-inspector
        version: v1
    spec:
      serviceAccountName: pod-inspector
      containers:
        - name: pod-inspector
          image: piotr1215/pod-inspector:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: SERVICE_ACCOUNT
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
            - name: APP_VERSION
              value: "v1.0.0"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pod-inspector
  namespace: pod-inspector
  labels:
    app: pod-inspector
spec:
  type: LoadBalancer
  selector:
    app: pod-inspector
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
