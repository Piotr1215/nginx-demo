apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-party
  labels:
    app: pod-party
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pod-party
  template:
    metadata:
      labels:
        app: pod-party
    spec:
      containers:
      - name: pod-party
        image: your-registry/pod-party:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        # Kubernetes Downward API - Pod metadata
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: SERVICE_ACCOUNT
          valueFrom:
            fieldRef:
              fieldPath: spec.serviceAccountName
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
